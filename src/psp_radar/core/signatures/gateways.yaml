      - { type: network_host, pattern: m.stripe.com, weight: 82 }
      - { type: csp_domain, pattern: "*.stripe.com", weight: 70 }
      - { type: cookie, pattern: '^__stripe_(mid|sid)$', weight: 80 }
      - { type: iframe_src, pattern: 'js\.stripe\.com/v3', weight: 86 }
