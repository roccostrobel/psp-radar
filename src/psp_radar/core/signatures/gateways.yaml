# Zahlungsabwickler / Acquirer (role: gateway)
#
# Gewichtungslogik:
#   95-99  Beweiskraft. Live-Key im Quelltext oder Request an die Zahlungs-API.
#   80-94  Sehr stark. PSP-eigenes SDK oder Checkout-Iframe geladen.
#   60-79  Stark. CSP-Whitelist, PSP-Cookie, Anbietername auf der
#          Zahlungsinformationsseite (payment_page_text).
#   30-59  Indiz. Assets, CDN-Hosts, DOM-Klassen.
#   1-29   Schwaches Indiz. Sichtbarer Text irgendwo (dom_text), Logos.
#          Nie allein entscheidend.
#
# Zum Unterschied zwischen dom_text und payment_page_text: Derselbe
# Anbietername wiegt sehr unterschiedlich, je nachdem wo er steht. In einem
# Blogartikel ist "Stripe" ein Zufall. Auf der Seite "Lieferung und Zahlung"
# ist es eine Aussage des Händlers über seine eigene Abwicklung — im
# DACH-Raum oft eine, zu der er verpflichtet ist. Deshalb 72 statt 22.
#
# Markt-Schwerpunkt dieser Datei: DACH.

version: "2026.08.1"

signatures:
  # ------------------------------------------------------------------
  # DACH-Anbieter zuerst — die werden von internationalen Tools regelmässig
  # übersehen, obwohl sie im deutschsprachigen Mittelstand dominieren.
  # ------------------------------------------------------------------

  - id: unzer
    name: Unzer
    role: gateway
    # Unzer ist durch Zukäufe gewachsen. Die alten Marken sind technisch
    # weiterhin aktiv, tauchen im Checkout unter eigenen Hosts auf und
    # werden von Shops auch so benannt — payolution etwa beim Rechnungskauf.
    aliases: ["Heidelpay", "heidelpay", "Unzer Payments", "payolution", "Payolution"]
    regions: ["DE", "AT", "CH"]
    homepage: https://www.unzer.com
    signals:
      - { type: network_host, pattern: api.unzer.com, weight: 96, note: "Zahlungs-API" }
      - { type: network_host, pattern: static.unzer.com, weight: 88, note: "Assets der Unzer-Bezahlmaske. Im Checkout von bergfreunde.de am 2026-08-15 bestätigt." }
      - { type: network_host, pattern: payolution.com, weight: 94, note: "Rechnungs-/Ratenkauf, Unzer-Marke" }
      - { type: network_host, pattern: paylater.unzer.com, weight: 95 }
      - { type: csp_domain, pattern: "*.payolution.com", weight: 70 }
      - { type: payment_page_text, pattern: '\bUnzer\b', weight: 74 }
      - { type: payment_page_text, pattern: '\bPayolution\b', weight: 74, note: "Wortlaut bei bergfreunde.de: Der Zahlungsprozess wird über unseren Dienstleister Payolution/Unzer abgewickelt" }
      - { type: payment_page_text, pattern: '\bheidelpay\b', weight: 70 }
      - { type: dom_text, pattern: 'Payolution', weight: 22 }
      - { type: network_host, pattern: api.heidelpay.com, weight: 96, note: "Alte Marke, weiterhin aktiv" }
      - { type: network_host, pattern: static.heidelpay.com, weight: 86 }
      - { type: network_host, pattern: payment.unzer.com, weight: 92 }
      - { type: html_regex, pattern: 's-pub-[0-9a-zA-Z\-]{20,}', weight: 97, note: "Öffentlicher Unzer-Key" }
      - { type: script_src, pattern: unzer, weight: 80 }
      - { type: csp_domain, pattern: "*.unzer.com", weight: 72 }
      - { type: csp_domain, pattern: "*.heidelpay.com", weight: 70 }
      - { type: html_regex, pattern: 'unzer(?:-|\.)(?:payments?|checkout|ui)', weight: 62 }

