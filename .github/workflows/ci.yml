name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, Typen, Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Abhaengigkeiten
        run: |
          uv venv --python 3.12
          uv pip install -e ".[dev]"

      - name: Lint
        run: uv run ruff check src/ tests/

      - name: Typen
        run: uv run mypy src/
        continue-on-error: true

      - name: Signatur-Datenbank
        run: uv run psp-radar signatures --check

      # Eigene Schritte, damit im CI-Log sofort sichtbar ist, welche der
      # drei Schutzschichten gerissen ist.
      - name: Selbsttest der Umgebung
        # Faengt Einrichtungsfehler ab, bevor sie wie Erkennungsfehler
        # aussehen. Chromium fehlt hier absichtlich -- der Selbsttest muss
        # das benennen, nicht daran zerbrechen.
        run: uv run psp-radar doctor || true

      - name: Sicherheit (keine Bestellung ausloesen)
        run: uv run pytest tests/test_safety.py -v

      - name: Architektur (Schichtentrennung)
        run: uv run pytest tests/test_architecture.py -v

      - name: Ehrlichkeit (Checkout-Status)
        run: uv run pytest tests/test_checkout_honesty.py -v

      - name: Alle Tests
        # Ohne Browser-Installation: der Kern ist per Architekturregel
        # offline testbar, das spart in der CI mehrere Minuten.
        run: uv run pytest -q -m "not network"

  docker:
    name: Docker-Image baut
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t psp-radar:ci .
      - name: Antwortet das Image?
        run: |
          docker run -d --name radar -p 8765:8765 psp-radar:ci
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8765/api/health > /dev/null; then
              echo "OK"; docker logs radar; exit 0
            fi
            sleep 2
          done
          echo "Keine Antwort"; docker logs radar; exit 1
